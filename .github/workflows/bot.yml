name: XAUUSD Bot v25.1

on:
  schedule:
    # 30-min cron untuk private repo (aman 2000 min/bulan)
    # Ganti ke '*/15 * * * 1-5' kalau public repo
    - cron: '*/30 * * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        required: true
        default: 'live'
        type: choice
        options: [live, backtest]
      days:
        required: false
        default: '60'
      equity:
        required: false
        default: '10000'

concurrency:
  group: xauusd-${{ github.event.inputs.mode || 'live' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: .cache/model.pkl
          key: xauusd-v251-${{ github.run_id }}
          restore-keys: xauusd-v251-
      - run: mkdir -p .cache
      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GH_GIST_ID: ${{ secrets.GH_GIST_ID }}
          MODEL_CACHE_PATH: ${{ github.workspace }}/.cache/model.pkl
        run: |
          if [ "${{ github.event.inputs.mode }}" = "backtest" ]; then
            python bot.py --backtest --days "${{ github.event.inputs.days || '60' }}" --equity "${{ github.event.inputs.equity || '10000' }}"
          else
            python bot.py
          fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/model.pkl
          key: xauusd-v251-${{ github.run_id }}
