name: XAUUSD Bot v25.3

on:
  schedule:
    - cron: '*/30 * * * 1-5'      # Main bot
    - cron: '0 */6 * * 1-5'        # Healthcheck
  workflow_dispatch:
    inputs:
      mode:
        required: true
        default: 'live'
        type: choice
        options: [live, backtest, monitor, monitor-dry-run, test-sources, audit-features, healthcheck]
      days:
        required: false
        default: '60'
      equity:
        required: false
        default: '10000'

concurrency:
  group: xauusd-${{ github.event.inputs.mode || github.event.schedule }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: .cache/model.pkl
          key: xauusd-v253-${{ github.run_id }}
          restore-keys: xauusd-v253-
      - run: mkdir -p .cache

      - name: Run bot
        if: |
          github.event.schedule == '*/30 * * * 1-5' ||
          github.event.inputs.mode == 'live'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GH_GIST_ID: ${{ secrets.GH_GIST_ID }}
          MODEL_CACHE_PATH: ${{ github.workspace }}/.cache/model.pkl
        run: python bot.py

      - name: Monitor check
        if: |
          always() &&
          (github.event.schedule == '*/30 * * * 1-5' ||
           github.event.inputs.mode == 'live')
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GH_GIST_ID: ${{ secrets.GH_GIST_ID }}
        run: python bot.py --monitor-check

      - name: Healthcheck
        if: |
          always() &&
          (github.event.schedule == '0 */6 * * 1-5' ||
           github.event.inputs.mode == 'healthcheck')
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GH_GIST_ID: ${{ secrets.GH_GIST_ID }}
        run: python bot.py --healthcheck

      - name: Backtest
        if: github.event.inputs.mode == 'backtest'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GH_GIST_ID: ${{ secrets.GH_GIST_ID }}
          MODEL_CACHE_PATH: ${{ github.workspace }}/.cache/model.pkl
        run: |
          python bot.py --backtest --days "${{ github.event.inputs.days || '60' }}" --equity "${{ github.event.inputs.equity || '10000' }}"

      - name: Monitor (force)
        if: github.event.inputs.mode == 'monitor'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GH_GIST_ID: ${{ secrets.GH_GIST_ID }}
        run: python bot.py --monitor

      - name: Monitor (dry-run)
        if: github.event.inputs.mode == 'monitor-dry-run'
        env:
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GH_GIST_ID: ${{ secrets.GH_GIST_ID }}
        run: python bot.py --monitor-dry-run

      - name: Test sources
        if: github.event.inputs.mode == 'test-sources'
        run: python bot.py --test-sources

      - name: Audit features
        if: github.event.inputs.mode == 'audit-features'
        env:
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GH_GIST_ID: ${{ secrets.GH_GIST_ID }}
        run: python bot.py --audit-features

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/model.pkl
          key: xauusd-v253-${{ github.run_id }}
