name: XAUUSD Quant Bot Auto-Runner

on:
  # Menjalankan bot secara otomatis setiap 15 menit pada hari kerja (Senin - Jumat)
  schedule:
    - cron: '*/15 * * * 1-5'
  
  # Memungkinkan juga dijalankan secara manual dari tab Actions di GitHub
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy pandas scikit-learn

      - name: Run Quant Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GH_GIST_ID: ${{ secrets.GH_GIST_ID }}
          DERIV_SYMBOL: "XAUUSD"
          BACKTEST_MODE: "false"
        run: |
          python xauusd_quant_bot_ultimate.py
