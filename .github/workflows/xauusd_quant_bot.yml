name: XAUUSD Ultimate Modern Quant Bot

on:
  schedule:
    # Jalankan setiap 15 menit.
    # GitHub Actions cron memakai UTC.
    - cron: "*/15 * * * *"

  workflow_dispatch:
    inputs:
      backtest_mode:
        description: "Jalankan dalam mode backtest?"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: xauusd_quant_bot
  cancel-in-progress: true

jobs:
  run-quant-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUNBUFFERED: "1"
      TZ: "Asia/Jakarta"

      # Non-sensitive configuration
      DERIV_APP_ID: ${{ vars.DERIV_APP_ID || '1089' }}
      DERIV_SYMBOL: ${{ vars.DERIV_SYMBOL || 'XAUUSD' }}
      BACKTEST_MODE: ${{ github.event.inputs.backtest_mode || 'false' }}

      # Secrets
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
      GH_GIST_ID: ${{ secrets.GH_GIST_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests websocket-client numpy pandas scikit-learn

      - name: Show runtime configuration
        run: |
          echo "Symbol: $DERIV_SYMBOL"
          echo "App ID: $DERIV_APP_ID"
          echo "Backtest mode: $BACKTEST_MODE"
          echo "Current UTC time: $(date -u)"
          echo "Current Jakarta time: $(TZ=Asia/Jakarta date)"

      - name: Run XAUUSD Ultimate Modern Quant Bot
        run: |
          python xauusd_quant_bot_ultimate.py

      - name: Upload bot logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-bot-failure-logs
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 7
