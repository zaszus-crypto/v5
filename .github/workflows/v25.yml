name: XAUUSD Bot v25.5 Runner

on:
  schedule:
    # Berjalan setiap 15 menit (Senin - Jumat) mencakup seluruh sesi market London, NY, Asia
    - cron: "*/15 * * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Pilih Mode Eksekusi"
        required: true
        default: "live"
        type: choice
        options:
          - "live"
          - "test-sources"
          - "backtest"
          - "monitor"

# Mencegah eksekusi ganda secara bersamaan (Atomic Lock di level GitHub Actions)
concurrency:
  group: xauusd-bot-execution
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Dependensi Kuantitatif
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests scikit-learn

      - name: 🚀 Eksekusi Bot Sinyal Live (v25.py)
        if: "${{ github.event_name == 'schedule' || github.event.inputs.mode == 'live' }}"
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN || secrets.GITHUB_TOKEN }}
          GH_GIST_ID: ${{ secrets.GH_GIST_ID }}
          ACCOUNT_MODE: ${{ vars.ACCOUNT_MODE || 'STANDARD' }}
          ACCOUNT_EQUITY: ${{ vars.ACCOUNT_EQUITY || '200.0' }}
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
        run: |
          python v25.py

      - name: 🧪 Uji Sumber Data (Test Sources)
        if: "${{ github.event.inputs.mode == 'test-sources' }}"
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
        run: |
          python v25.py --test-sources

      - name: 📊 Jalankan Backtest Kuantitatif
        if: "${{ github.event.inputs.mode == 'backtest' }}"
        run: |
          python v25.py --backtest

      - name: 📈 Laporan Monitor Harian
        if: "${{ github.event.inputs.mode == 'monitor' }}"
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN || secrets.GITHUB_TOKEN }}
          GH_GIST_ID: ${{ secrets.GH_GIST_ID }}
        run: |
          python v25.py --monitor-dry-run

      - name: 💾 Upload Log Run jika Terjadi Error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bot-error-log
          path: |
            bot_state_v25.json
            *.log
          retention-days: 7
